<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FYP - Blackjack - Leaderboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>

<div th:insert="headers/header.html"></div>

<div class="row d-flex-justify-content-center m-5">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 d-flex justify-content-center">
        <h3>Top 10 Blackjack Players</h3>
    </div>
</div>

<div class="row d-flex-justify-content-center m-5">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 d-flex justify-content-center">
        <table class="table" style="width:100%">
            <thead>
            <tr>
                <th>Date</th>
                <th>Amount Won</th>
                <th>Game ID</th>
                <th>Player Name</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="leaderboard: ${leaderboardList}">
                <td th:text="${leaderboard.getDate()}"></td>
                <td th:text="'€' + ${leaderboard.getAmountWon()}"></td>
                <td th:text="${leaderboard.getGameNumber()}"></td>
                <td th:text="${leaderboard.getPlayerName()}"></td>
            </tr>
            </tbody>
            <tfoot>

            </tfoot>
        </table>
    </div>
</div>

<div th:insert="footers/footer.html"></div>

</body>
</html>
