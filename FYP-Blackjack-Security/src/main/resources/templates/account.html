<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="https://www.thymeleaf.org">
    <title>User Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>

<div th:insert="headers/header.html"></div>

<div class="row d-flex justify-content-center m-5">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 d-flex justify-content-center">
        <h3 th:if="${#ctx.session.userRole} == 'user'">Your Account</h3>
        <h3 th:if="${#ctx.session.userRole} == 'admin'">Admin Dashboard</h3>
    </div>
</div>

<div class="row d-flex justify-content-center m-5" th:if="${#ctx.session.userRole} == 'admin'">
    <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-xs-12 d-flex justify-content-center">
        <div class="card" style="width: 400px;">
            <img class="card-img-top" src="/images/Icons/logsIcon.jpg" alt="Card image" style="width:100%">
            <div class="card-body">
                <h4 class="card-title">View Game Logs</h4>
                <a href="/viewLogs" class="btn btn-outline-dark">See Logs</a>
            </div>
        </div>
    </div>
    <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-xs-12 d-flex justify-content-center">
        <div class="card" style="width: 400px;">
            <img class="card-img-top" src="/images/Icons/account-icon.png" alt="Card image" style="width:100%">
            <div class="card-body">
                <h4 class="card-title">Delete / Suspend User Accounts</h4>
                <a href="/viewUserAccounts" class="btn btn-outline-dark">View Accounts</a>
            </div>
        </div>
    </div>
</div>

<div class="row d-flex justify-content-center m-5" th:if="${#ctx.session.userRole} == 'admin'">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 d-flex justify-content-center">
        <p><a href="/logout" class="btn btn-outline-warning">Logout</a></p>
    </div>
</div>

<div class="row d-flex justify-content-center m-5" th:if="${#ctx.session.userRole} == 'user'">
    <div class="col-xl-4 col-lg-4 col-md-4 col-sm-4 col-xs-4 d-flex justify-content-center">
        <div class="card" style="width: 400px;">
            <img class="card-img-top" src="" alt="Info Icon" style="">
            <div class="card-body">
                <h4 class="card-title">Account Information</h4>
                <a href="/viewAccountDetails" class="btn btn-primary">View Information</a>
            </div>
        </div>
    </div>
</div>

<div class="row d-flex justify-content-center m-5" th:if="${#ctx.session.userRole} == 'user'">
    <div class="col-xl-4 col-lg-4 col-md-4 col-sm-4 col-xs-4 d-flex justify-content-center">
        <div class="card" style="width: 400px;">
            <img class="card-img-top" src="" alt="Info Icon" style="">
            <div class="card-body">
                <h4 class="card-title">Game History</h4>
                <a href="/" class="btn btn-primary">View History</a>
            </div>
        </div>
    </div>
</div>

<div class="row d-flex justify-content-center m-5" th:if="${#ctx.session.userRole} == 'user'">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 d-flex justify-content-center">
        <p><a href="/logout" class="btn btn-outline-danger">Logout</a>
            <a href="/deleteAccount" class="btn btn-outline-warning">Delete Account</a></p>
    </div>
</div>

<div th:insert="footers/footer.html"></div>
</body>
</html>
