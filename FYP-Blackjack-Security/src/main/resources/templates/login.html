<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div th:insert="headers/header.html"></div>

<div class="container">
    <div class="row d-flex justify-content-center m-5">
        <div class="col-md-6">
            <div th:if="${param.error}">
                <div class="alert alert-danger">Invalid Username or Password</div>
            </div>
            <div th:if="${param.logout}">
                <div class="alert alert-success">You have been logged out.</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h2 class="text-center">Login</h2>
                </div>
                <div class="card-body">
                    <form method="post" role="form" th:action="@{/login}"
                          class="form-horizontal">
                        <div class="form-group mb-3">
                            <label class="control-label"> Username</label> <input type="text"
                                                                                  id="username" name="username" class="form-control"
                                                                                  placeholder="Enter username" />
                        </div>
                        <div class="form-group mb-3">
                            <label class="control-label"> Password</label> <input
                                type="password" id="password" name="password"
                                class="form-control" placeholder="Enter password" />
                        </div>
                        <div class="form-group mb-3">
                            <button type="submit" class="btn btn-outline-primary">Login</button>
                        </div>
                        <div class="form-group mb-3">
                            <a class="btn btn-outline-dark" href="/register">Register</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


<div th:insert="footers/footer.html"></div>

</body>
</html>
