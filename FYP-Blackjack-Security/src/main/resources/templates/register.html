<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div th:insert="headers/header.html"></div>

<div class="row d-flex justify-content-center m-5">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 d-flex justify-content-center">
        <h3>Create your Account</h3>
    </div>
</div>

<div class="row d-flex justify-content-center m-5">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 d-flex justify-content-center m-5">
        <form class="row g-3" th:action="@{/register}" th:object="${user}" method="post">
            <div class="col-md-6">
                <label for="firstname" class="form-label">First Name:</label>
                <input type="text" th:field="*{firstName}" class="form-control" id="firstname" placeholder="Enter First Name...">
            </div>
            <div class="col-md-6">
                <label for="lastname" class="form-label">Last Name:</label>
                <input type="text" th:field="*{lastName}" class="form-control" id="lastname" placeholder="Enter Last Name...">
            </div>
            <div class="col-12">
                <label for="email" class="form-label">Email:</label>
                <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="Enter Email...">
            </div>
            <div class="col-6">
                <label for="username" class="form-label">Username:</label>
                <input type="email" th:field="*{username}" class="form-control" id="username" placeholder="Enter Username...">
            </div>
            <div class="col-6">
                <label for="password" class="form-label">Password:</label>
                <input type="password" th:field="*{password}" class="form-control" id="password" placeholder="Enter Password...">
            </div>
            <div class="col-12">
                <label for="phonenumber" class="form-label">Phone Number:</label>
                <input type="text" class="form-control" th:field="*{phoneNumber}" id="phonenumber" placeholder="Enter Phone Number...">
            </div>
            <div class="col-md-6">
                <label for="address" class="form-label">Address Line 1:</label>
                <input type="text" class="form-control" th:field="*{address}" id="address" placeholder="Enter Address...">
            </div>
            <div class="col-md-4">
                <label for="country" class="form-label">Country</label>
                <input type="text" class="form-control" th:field="*{country}" id="country" placeholder="Enter Country...">
            </div>
            <div class="col-md-2">
                <label for="postcode" class="form-label">Post Code</label>
                <input type="text" th:field="*{postCode}" class="form-control" id="postcode" placeholder="Enter Post Code...">
            </div>
            <div class="col-12 d-flex justify-content-center">
                <button type="submit" class="btn btn-outline-dark">Create Account</button>
            </div>
        </form>
    </div>
</div>

<div th:insert="footers/footer.html"></div>

</body>
</html>
