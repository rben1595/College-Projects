<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" xmlns:th="https://www.thymeleaf.org">
  <title>Cart - Page</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>

<div th:insert="headers/header.html"></div>


<div class="row d-flex-justify-content-center">
  <div class="col-xl-6 d-flex justify-content-center m-5">
    <table class="table table-bordered">
      <thead>
      <tr>
        <th>Item Name</th>
        <th>Item Price</th>
        <th>Quantity</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item: ${#ctx.session.cart.getCartItemsList()}">
        <td th:text="${item.item_name}"></td>
        <td th:text="${item.item_cost}"></td>
        <td th:text="${item.qty}"></td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="row d-flex-justify-content-center">
  <div class="col-xl-6 d-flex justify-content-center m-5">
    <a href="/checkOut" class="btn btn-outline-dark">Proceed to Payment</a>
  </div>
</div>

<div th:insert="footers/footer.html"></div>
</body>
</html>
