<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="/js/script.js" type="text/javascript" th:inline="javascript"></script>

</head>
<body style="background-color: darkgreen">

<div th:insert="headers/gameHeader.html"></div>

<!-- Game Functions Navbar -->
<nav class="navbar navbar-expand-sm navbar-light bg-light">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <p class="nav-link">
                        <button onclick="hit()" type="button" class="btn btn-outline-danger" id="hit">Hit</button>
                    </p>
                </li>
                <li class="nav-item">
                    <p class="nav-link">
                        <button onclick="stand()" type="button" class="btn btn-outline-success" id="stand">Stand</button>
                    </p>
                </li>
                <li class="nav-item" style="color: white">
                    <p class="nav-link">
                        <button onclick="doubleDown()" type="button" class="btn btn-outline-info" id="doubleDown">Double Down</button>
                    </p>
                </li>
                <li class="nav-item" style="color: white">
                    <p class="nav-link">
                        <button onclick="split()" type="button" class="btn btn-outline-warning" id="split">Split</button>
                    </p>
                </li>
            </ul>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <p class="nav-link">
                        <button id="100chip" onclick="place100Bet()" class="btn">
                            <img src="/images/Poker-Chips/100-chip.png" alt="€200 Poker Chip" width="75px" height="75px"></button>
                    </p>
                </li>
                <li class="nav-item">
                    <p class="nav-link">
                        <button onclick="place200Bet()" id="200chip" type="button" class="btn">
                            <img src="/images/Poker-Chips/200-chip.png" alt="€200 Poker Chip" width="75px" height="75px"></button>
                    </p>
                </li>
                <li class="nav-item" style="color: white">
                    <p class="nav-link">
                        <button onclick="place300Bet()" id="300chip" type="button" class="btn">
                            <img src="/images/Poker-Chips/300-chip.png" alt="€300 Poker Chip" width="75px" height="75px"></button>
                    </p>
                </li>
                <li class="nav-item" style="color: white">
                    <p class="nav-link">
                        <button onclick="place500Bet()" id="500chip" type="button" class="btn">
                            <img src="/images/Poker-Chips/500-chip.png" alt="€500 Poker Chip" width="75px" height="75px"></button>
                    </p>
                </li>
                <li class="nav-item" style="color: white">
                    <p class="nav-link">
                        <button onclick="place1000Bet()" id="1000chip" type="button" class="btn">
                            <img src="/images/Poker-Chips/1000-chip.png" alt="€1000 Poker Chip" width="75px" height="75px"></button>
                    </p>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="row d-flex justify-content-center m-5">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 d-flex justify-content-center">
        <h4>Dealer's Cards</h4>
    </div>
</div>

<div class="row d-flex justify-content-center m-5">
    <div id="dealerHand" class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 d-flex justify-content-center">

    </div>
</div>

<div class="row d-flex justify-content-center m-5">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 d-flex justify-content-center">
        <h4>Your Cards</h4>
    </div>
</div>

<div class="row d-flex justify-content-center m-5">
    <div id="playerHand" class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 d-flex justify-content-center">

    </div>
</div>

<div class="row d-flex justify-content-center m-5">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 d-flex justify-content-center">
        <button id="roundOverBtn" onclick="dealNewRound()" class="btn btn-outline-warning">Deal New Round</button>
    </div>
</div>

</body>
</html>
