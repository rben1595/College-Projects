<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" xmlns:th="https://www.thymeleaf.org">
  <title>Game - Header</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand"><img th:src="@{images/Logo/pokerChips.png}" style="border-radius: 15px" alt="Logo" height="50px;" width="50px;"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <p class="nav-link">
            <a class="btn btn-outline-info" href="/game">New Game</a></p>
        </li>
        <li class="nav-item">
          <p class="nav-link">
            <button onclick="gameOver()" type="button" class="btn btn-outline-danger" id="gameOver">Leave Game</button></p>
        </li>
        <li class="nav-item" style="color: white">
          <p class="nav-link" th:text="'Account Total: €' + ${#ctx.session.account_credits}" id="accTlt"></p>
        </li>
        <li class="nav-item" style="color: white">
          <p class="nav-link" th:text="'Betting Total: €0'" id="betTlt"></p>
        </li>
        <li class="nav-item" style="color: white">
          <p class="nav-link" th:text="'Total Won: €0'" id="tltWon"></p>
        </li>
        <li class="nav-item" style="color: white">
          <p class="nav-link" th:text="'Total Lost: €0'" id="tltLst"></p>
        </li>
      </ul>
    </div>
  </div>
</nav>

</body>
</html>
